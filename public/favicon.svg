<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="0.5"/>
  <!-- Wallet shape -->
  <rect x="7" y="10" width="18" height="14" rx="3" fill="none" stroke="url(#purple)" stroke-width="1.8"/>
  <rect x="7" y="10" width="18" height="5" rx="3" fill="url(#purple)" opacity="0.15"/>
  <circle cx="20" cy="18" r="2" fill="url(#purple)"/>
  <!-- Crypto coin -->
  <circle cx="22" cy="9" r="4.5" fill="url(#bg)" stroke="url(#purple)" stroke-width="1.5"/>
  <text x="22" y="11.2" text-anchor="middle" font-size="6" font-weight="bold" fill="url(#purple)" font-family="Arial">$</text>
</svg>
